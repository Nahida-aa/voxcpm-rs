# vox-lab 侧的 VoxCPM Burn 入口（原 packages/voxcpm-burn）。
#
# 放在 voxcpm-rs 的独立 workspace 里，是为了让 bf16/SPIR-V 的
# [patch.crates-io]（vendor/patched/{burn-cubecl,cubecl-spirv}）生效 ——
# cargo 的 patch 只在 workspace 根生效，而 voxcpm-rs 已不再作为 vox-lab 的成员。

[package]
name = "cli"
version = "0.1.0"
edition = "2021"

# 保持 crate 名与既有 bin 里的调用一致（voxcpm_burn::…）
[lib]
name = "voxcpm_burn"
path = "src/lib.rs"

[[bin]]
name = "voxlab-dump"
path = "src/bin/voxlab-dump.rs"

[[bin]]
name = "voxcpm-burn-wgpu"
path = "src/bin/voxcpm-burn-wgpu.rs"
required-features = ["wgpu"]

[[bin]]
name = "voxcpm-burn-cpu"
path = "src/bin/voxcpm-burn-cpu.rs"
required-features = ["cpu"]

[[bin]]
name = "voxcpm-burn-vulkan"
path = "src/bin/voxcpm-burn-vulkan.rs"
required-features = ["vulkan"]

[features]
default = ["wgpu"]
wgpu = ["voxcpm-rs/wgpu"]
cpu = ["voxcpm-rs/cpu", "burn/ndarray"]
cpu-blas-dump = ["voxcpm-rs/cpu-blas", "burn/ndarray", "burn/openblas"]
cpu-blas = ["voxcpm-rs/cpu-blas", "burn/ndarray", "burn/openblas"]
vulkan = ["voxcpm-rs/vulkan", "dep:burn-cubecl"]

[dependencies]
voxcpm-rs = { path = ".." }
# 仅用于 vulkan 后端的 matmul 策略开关（gfx1103 无 bf16 matmul）
burn-cubecl = { path = "../vendor/patched/burn-cubecl", optional = true }
burn = { version = "0.20.1", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
hound = "3"
anyhow = "1"
pollster = "0.4"
env_logger = "0.11"
half = "2"
